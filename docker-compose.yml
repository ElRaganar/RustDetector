version: "3.9"

services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  info:
    image: alpine
    command: sh -c 'echo "Frontend running at http://localhost:5173" && echo "Backend running at http://localhost:8000"'
    depends_on:
      - frontend
      - backend